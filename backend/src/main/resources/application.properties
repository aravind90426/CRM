# ===================================================================
# Server Configuration
# ===================================================================
server.port=8080
server.servlet.context-path=/

# ===================================================================
# Spring Application
# ===================================================================
spring.application.name=calling-crm-backend

# ===================================================================
# MySQL Database Credentials & Connection
# (Edit your username and password below)
# ===================================================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:calling_crm}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:2004}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Application Security & JWT Configuration
# ===================================================================
app.jwt.secret=${JWT_SECRET:9a4f2c8d3e5b7a1f6c8e0d2b4a6c8e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS Configuration
# ===================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ===================================================================
# Google Sheets Integration
# ===================================================================
app.google-sheets.mock-delay-ms=1500

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.com.crm=INFO
logging.level.org.springframework.security=INFO
